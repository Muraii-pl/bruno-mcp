services:
  bruno-mcp:
    image: ${BRUNO_MCP_IMAGE:-registry.gitlab.twoja-firma.pl/platform/bruno-mcp:latest}
    # albo lokalnie: build: .   (scripts/install-server.sh --build robi to za Ciebie)
    restart: unless-stopped
    ports:
      - "127.0.0.1:${BRUNO_MCP_PORT:-3000}:3000"   # na zewnątrz tylko przez reverse proxy z HTTPS
    # cała konfiguracja i sekrety w .env (patrz .env.example / scripts/install-server.sh)
    env_file: .env
    environment:
      GITLAB_URL: ${GITLAB_URL:?ustaw GITLAB_URL w .env}
      GITLAB_PROJECT: ${GITLAB_PROJECT:?ustaw GITLAB_PROJECT w .env}
      TARGET_BRANCH: ${TARGET_BRANCH:-main}
      DEFAULT_RUN_ENV: ${DEFAULT_RUN_ENV:-}
      SESSION_IDLE_MINUTES: ${SESSION_IDLE_MINUTES:-240}
    volumes:
      - bruno-data:/data

volumes:
  bruno-data:
